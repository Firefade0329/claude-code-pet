name: 功能建议 / Feature request
description: 想要的新功能或改进
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的想法！这是个人项目，没有固定的响应时间，也不保证采纳每个建议。
        `hooks/register.tsx` 是构建产物，实现由维护者在本机完成，所以这里只需要把想法说清楚。
        **不要贴个人信息。**
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你现在遇到了什么不方便，或者想要什么效果。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你期望的做法
      description: 越具体越好，可以描述界面、按钮、台词或数值。
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他办法（可选）
  - type: input
    id: claude-code-version
    attributes:
      label: Claude Code 版本（可选）
      description: 如果这个建议和某个版本的行为有关，在终端运行 `claude --version`。
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我搜过已有的 Issue，没有找到相同的建议。
          required: true
        - label: 我知道 `hooks/register.tsx` 是构建产物，实现会由维护者在本机完成。
          required: true
